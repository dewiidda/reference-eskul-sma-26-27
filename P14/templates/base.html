<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="/" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
            <a href="/about" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
            <a href="/skills" class="{% if request.endpoint == 'skills' %}active{% endif %}">Skills</a>
            <a href="/experience" class="{% if request.endpoint == 'experience' %}active{% endif %}">Experience</a>
            <a href="/project" class="{% if request.endpoint == 'project' or request.endpoint == 'project_detail' %}active{% endif %}">Projects</a>
            <a href="/contact" class="{% if request.endpoint == 'contact' %}active{% endif %}">Contact</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %} {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Dewi Idda Rohmana. Built with Python & Flask.</p>
    </footer>
</body>
</html>
