{% extends "base.html" %}
{% block title %}Skills - Portofolio Dewi{% endblock %}
{% block content %}
<section class="skills-section">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Keahlian & Teknologi</h2>
    <p style="text-align: center; color: #1b2c45; margin-bottom: 2rem;">
        Berikut adalah teknologi dan bahasa pemrograman yang saya kuasai:
    </p>
    
    <div class="skills-grid">
        {% for skill in skills %}
        <div class="skill-card">
            <div class="skill-info">
                <span class="badge">{{ skill.name }}</span>
                <span class="level-text">{{ skill.level }}</span>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" style="width: {{ skill.percent }}%;"></div>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
